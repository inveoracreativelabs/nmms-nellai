<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMMS நெல்லை</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #090a0f;
            --bg-gradient: radial-gradient(circle at 50% -20%, #1a1f2c 0%, #090a0f 70%);
            --card-bg: rgba(17, 21, 30, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-hover: rgba(255, 107, 0, 0.3);
            --text-title: #ffffff;
            --text-body: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-orange: #ff6b00;
            --pill-bg: #ffffff;
            --pill-text: #090a0f;
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-border: #10b981;
            --success-text: #34d399;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-border: #ef4444;
            --error-text: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: var(--bg-gradient);
            color: var(--text-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-attachment: fixed;
        }

        /* Top Header Navigation */
        .header-container {
            width: 100%;
            max-width: 820px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .brand-title {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-title);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title span {
            color: var(--accent-orange);
        }

        /* Language Toggle Pill */
        .toggle-btn {
            background: var(--pill-bg);
            color: var(--pill-text);
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
            background: #f8fafc;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 820px;
        }

        /* Lesson Header Box */
        .lesson-header {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 32px;
            border-radius: 20px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .lesson-header::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-orange), transparent);
        }

        .lesson-header h1 {
            font-size: 1.8rem;
            color: var(--text-title);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .lesson-header p {
            font-size: 0.92rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Question Cards */
        .question-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 26px;
            margin-bottom: 22px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .question-card:hover {
            border-color: var(--card-border-hover);
            transform: translateY(-2px);
        }

        .question-title {
            font-size: 1.08rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.6;
            color: var(--text-title);
            display: flex;
            gap: 10px;
        }

        .q-number {
            color: var(--accent-orange);
            font-weight: 700;
        }

        /* Options List */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            list-style: none;
        }

        .option-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 15px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            color: var(--text-body);
        }

        .option-item:hover {
            border-color: rgba(255, 107, 0, 0.4);
            background: rgba(255, 107, 0, 0.05);
            transform: translateX(4px);
        }

        .option-item.correct {
            background: var(--success-bg) !important;
            border-color: var(--success-border) !important;
            color: var(--success-text) !important;
            font-weight: 600;
        }

        .option-item.wrong {
            background: var(--error-bg) !important;
            border-color: var(--error-border) !important;
            color: var(--error-text) !important;
        }

        /* Explanation Box */
        .explanation-box {
            margin-top: 16px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-left: 3px solid var(--accent-orange);
            border-radius: 10px;
            font-size: 0.88rem;
            color: #cbd5e1;
            display: none;
            line-height: 1.6;
        }

        .explanation-title {
            font-weight: 700;
            color: var(--text-title);
            margin-bottom: 4px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="header-container">
        <div class="brand-title">
            NMMS நெல்லை
        </div>
        <button class="toggle-btn" onclick="toggleLanguage()">
            🌐 <span id="toggle-text">English</span>
        </button>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="lesson-header">
            <h1 id="lesson-title">ஏற்றப்படுகிறது...</h1>
            <p id="lesson-subtitle">Class 7 Science — NMMS Self Practice</p>
        </div>

        <div id="quiz-container">
            <div class="loading">வினாத்தாள் தயார் செய்யப்படுகிறது...</div>
        </div>
    </main>

    <script>
        let currentLang = 'ta';
        let quizData = null;

        fetch('./data/sample_lesson_output.json')
            .then(response => {
                if (!response.ok) throw new Error("JSON file not found");
                return response.json();
            })
            .then(data => {
                quizData = data;
                renderQuiz();
            })
            .catch(error => {
                console.error("Error loading JSON:", error);
                document.getElementById('quiz-container').innerHTML = 
                    `<div class="loading" style="color:var(--error-text)">பிழை: JSON கோப்பை வாசிக்க முடியவில்லை!</div>`;
            });

        function renderQuiz() {
            if (!quizData) return;

            document.getElementById('lesson-title').innerText = 
                currentLang === 'ta' ? quizData.lesson_name : quizData.lesson_name_en;

            document.getElementById('toggle-text').innerText = 
                currentLang === 'ta' ? 'English' : 'தமிழ்';

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            quizData.questions.forEach((q, index) => {
                const qText = currentLang === 'ta' ? q.question_ta : q.question_en;
                const options = currentLang === 'ta' ? q.options_ta : q.options_en;
                const explanation = currentLang === 'ta' ? q.explanation_ta : q.explanation_en;

                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="question-title">
                        <span class="q-number">0${index + 1}.</span>
                        <span>${qText}</span>
                    </div>
                    <ul class="options-list">
                        ${options.map((opt, i) => `
                            <li class="option-item" onclick="checkAnswer(this, ${i}, ${q.answer}, 'exp-${index}')">
                                ${opt}
                            </li>
                        `).join('')}
                    </ul>
                    <div id="exp-${index}" class="explanation-box">
                        <div class="explanation-title">💡 ${currentLang === 'ta' ? 'விளக்கம்:' : 'Explanation:'}</div>
                        <div>${explanation}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswer(element, selectedIdx, correctIdx, expId) {
            const parentList = element.parentElement;
            const options = parentList.querySelectorAll('.option-item');

            if (parentList.classList.contains('answered')) return;
            parentList.classList.add('answered');

            options.forEach((opt, idx) => {
                if (idx === correctIdx) {
                    opt.classList.add('correct');
                } else if (idx === selectedIdx) {
                    opt.classList.add('wrong');
                }
            });

            const expBox = document.getElementById(expId);
            if (expBox) expBox.style.display = 'block';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ta' ? 'en' : 'ta';
            renderQuiz();
        }
    </script>
</body>
</html>
